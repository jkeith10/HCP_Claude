<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0b3d64" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>HVAC Assistant</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Login gate (shown only if the server requires a password) -->
    <div id="login" class="login hidden">
      <form id="login-form" class="login-card">
        <h1>HVAC Assistant</h1>
        <p>Enter the access password.</p>
        <input
          id="login-password"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          inputmode="text"
        />
        <button type="submit">Unlock</button>
        <p id="login-error" class="error hidden">Incorrect password.</p>
      </form>
    </div>

    <!-- Main app -->
    <div id="app" class="app hidden">
      <header class="topbar">
        <div class="title">
          <span class="dot"></span> HVAC Assistant
        </div>
        <div class="actions">
          <button id="settings-btn" class="ghost" title="Voice settings" aria-label="Voice settings">⚙</button>
          <button id="reset-btn" class="ghost" title="New conversation">New</button>
        </div>
      </header>

      <main id="messages" class="messages" aria-live="polite"></main>

      <footer class="composer">
        <button id="mic-btn" class="mic" title="Speak" aria-label="Speak">🎤</button>
        <textarea
          id="input"
          rows="1"
          placeholder="Ask about the schedule, customers, invoices…"
          enterkeyhint="send"
        ></textarea>
        <button id="send-btn" class="send" title="Send" aria-label="Send">➤</button>
      </footer>
    </div>

    <!-- Voice settings -->
    <div id="settings" class="modal hidden">
      <div class="modal-card">
        <h3>Voice</h3>
        <label class="row">
          <input type="checkbox" id="voice-enabled" /> Read replies aloud
        </label>
        <label class="field">
          Voice
          <select id="voice-select"></select>
        </label>
        <label class="field">
          Speed <span id="rate-val" class="val"></span>
          <input type="range" id="voice-rate" min="0.7" max="1.3" step="0.05" />
        </label>
        <label class="field">
          Pitch <span id="pitch-val" class="val"></span>
          <input type="range" id="voice-pitch" min="0.6" max="1.4" step="0.05" />
        </label>
        <div class="modal-buttons">
          <button id="voice-preview" class="secondary">▶ Preview</button>
          <button id="settings-close" class="primary">Done</button>
        </div>
        <p class="hint" id="voice-hint"></p>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
